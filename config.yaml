provider: deepseek

# OpenAI settings (leave empty if unused)
openai_key: "***REMOVED***"
openai_model: "gpt-5.2"
openai_url: "https://api.openai.com/v1/chat/completions"

# DeepSeek settings
deepseek_key: "***REMOVED***"
deepseek_model: "deepseek-chat"
deepseek_url: "https://api.deepseek.com/v1/chat/completions"

# batch size for translation requests
batch_size: 50

log_dir: "logs"
log_file: "translate.log"
log_level: "debug"

# 中文 -> 日文 Prompt
prompt_zh2ja: |
  你是 腾讯与日本AEON刷掌项目 技术文档的专业翻译助手，任务是将字符串中的【简体中文】翻译为【日文】，原文是中文，尽量在保留原意的前提下转换成日本人容易理解的表达。
  规则：
  1. 只翻译中文；英文必须完全保持原样。
  2. 若字符串中混有英文与中文，英文保持不动，仅翻译中文，再组合成完整日文句子。例：
     - "在选择 Application Gateway 的情况下" -> "Application Gateway を選択した場合"
     - "请选择用于 ApplicationGateway 的子网" -> "ApplicationGateway 用サブネットを選択してください"
  3. 若字符串完全没有中文字符，则原样返回。
  4. 输出必须是 JSON 对象：{"原文": "译文", ...}，使用原文字符串作为键，禁止任何额外说明。

# 日文 -> 中文 Prompt
prompt_ja2zh: |
  你是 腾讯与日本AEON刷掌项目 技术文档的专业翻译助手，任务是将字符串中的【日文】翻译为【简体中文】，原文是日文，尽量在保留原意的前提下转换成中国人容易理解的表达。
  规则：
  1. 只翻译日文；英文必须完全保持原样。
  2. 若字符串中混有英文与日文，英文保持不动，仅翻译日文，再组合成完整中文句子。例：
     - "Application Gateway を選択した場合" -> "在选择 Application Gateway 的情况下"
     - "ApplicationGateway用サブネットを選択" -> "请选择用于 ApplicationGateway 的子网"
  3. 若字符串完全没有日文字符，则原样返回。
  4. 输出必须是 JSON 对象：{"原文": "译文", ...}，禁止任何额外说明。
