name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
            ext: .exe
          - goos: linux
            goarch: amd64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="translate${{ matrix.ext }}"
          out_dir="dist/translate_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "${out_dir}"
          go build -trimpath -ldflags="-s -w" -o "${out_dir}/${binary}" .
          cp config.yaml "${out_dir}/config.yaml"
          cp readme.md "${out_dir}/README.md"

      - name: Package Artifact
        run: |
          set -euo pipefail
          base="translate_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -rq "${base}.zip" "${base}"
          else
            tar -czf "${base}.tar.gz" "${base}"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: translate_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/translate_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
